[project]
site_url = "https://fswair.github.io/vsh/"
site_name = "VSH"
site_description = "Low-latency transactional filesystem simulation for Rust, Python, MCP, and coding agents."
site_author = "VSH contributors"
repo_url = "https://github.com/fswair/vsh"
repo_name = "fswair/vsh"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 VSH contributors · Apache-2.0"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/stylesheets/vsh.css"]
extra_javascript = [{ path = "assets/javascripts/copy-markdown.js", defer = true }]

nav = [
  { "Overview" = "index.md" },
  { "Start here" = [
    "start/index.md",
    { "How VSH works" = "start/how-it-works.md" },
    { "Use cases" = "start/use-cases.md" },
  ] },
  { "Guides" = [
    { "Transactions" = "guides/transactions.md" },
    { "Policies and budgets" = "guides/policies-and-budgets.md" },
    { "Efficient usage" = "guides/efficient-usage.md" },
    { "Troubleshooting" = "guides/troubleshooting.md" },
    { "Command line" = "guides/cli.md" },
  ] },
  { "Tutorials" = [
    { "Pydantic AI: deterministic review" = "tutorials/pydantic-ai-deterministic.md" },
    { "Pydantic AI: LLM judge" = "tutorials/pydantic-ai-judge.md" },
  ] },
  { "Python SDK" = [
    "python/index.md",
    { "API reference" = "python/api.md" },
    { "Commit hooks" = "python/hooks.md" },
    { "LLM commit judge" = "python/commit-judge.md" },
    { "Cookbook" = "python/examples.md" },
  ] },
  { "Rust SDK" = [
    "rust/index.md",
    { "API reference" = "rust/api.md" },
    { "Crate map" = "rust/crates.md" },
    { "Cookbook" = "rust/examples.md" },
  ] },
  { "MCP and agents" = [
    { "MCP server" = "integrations/mcp.md" },
    { "Pydantic AI capability" = "integrations/pydantic-ai.md" },
    { "Monty VSH functions" = "integrations/monty-tools.md" },
    { "Agent environments" = "integrations/agents.md" },
  ] },
  { "Engineering" = [
    { "Architecture" = "ARCHITECTURE.md" },
    { "Guarantees" = "guarantees.md" },
    { "Security model" = "security.md" },
    { "Threat model" = "threat-model.md" },
    { "Language parity" = "language-parity.md" },
    { "Performance" = "performance.md" },
    { "Dependency policy" = "dependency-policy.md" },
    { "Coverage contract" = "coverage.md" },
    { "Development" = "development.md" },
    { "Release" = "release.md" },
  ] },
]

[project.theme]
language = "en"
custom_dir = "theme"
favicon = "assets/mark.svg"
logo = "assets/mark.svg"
features = [
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.sections",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.font]
text = "DM Sans"
code = "IBM Plex Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Use dark theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Use light theme"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/fswair/vsh"
name = "VSH on GitHub"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
