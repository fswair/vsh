[project]
name = "vbash"
version = "0.3.0"
description = "VSH is a low-latency transactional filesystem simulator backed by Rust."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
keywords = ["agents", "commands", "mcp", "simulation", "workspaces"]
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp==3.4.7"]
dev = [
    "basedpyright",
    "maturin==1.15.0",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "zensical==0.0.57",
]

[dependency-groups]
dev = [
    "basedpyright",
    "maturin==1.15.0",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "zensical==0.0.57",
]
[tool.uv]
default-groups = ["dev"]

[project.scripts]
vsh = "vsh.__main__:main"
vsh-codemode = "vsh.mcp.codemode_server:main"

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "vsh_build_backend"
backend-path = ["scripts"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/vsh-python/Cargo.toml"
module-name = "vsh._native"
python-source = "src"
strip = true
locked = true
data = "python-data"
exclude = [
    "python-data/**/.gitkeep",
    "src/vsh/**/__pycache__/**",
    "src/vsh/**/*.pyc",
    "src/vsh/_native*.so",
    "src/vsh/_native*.dylib",
    "src/vsh/_native*.pyd",
    "src/vsh/agent/**",
    "src/vsh/artifacts/**",
    "src/vsh/execute/**",
    "src/vsh/extensions/**",
    "src/vsh/http/**",
    "src/vsh/io/**",
    "src/vsh/perf/**",
    "src/vsh/persistence/**",
    "src/vsh/plans/**",
    "src/vsh/policy/**",
    "src/vsh/registry/**",
    "src/vsh/sandbox/**",
    "src/vsh/schemas/**",
    "src/vsh/session/**",
    "src/vsh/simulate/**",
    "src/vsh/snapshot/**",
    "src/vsh/effects.py",
    "src/vsh/errors.py",
    "src/vsh/limits.py",
    "src/vsh/runtime.py",
    "src/vsh/mcp/receipts.py",
    "src/vsh/mcp/resources.py",
    "src/vsh/mcp/tools.py",
]
include = [
    { path = "scripts/vsh_build_backend.py", format = "sdist" },
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "THIRD_PARTY_NOTICES.md", format = "sdist" },
    { path = "THIRD_PARTY_NOTICES.md", format = "wheel" },
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.ty]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [
    "plans/**",
]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = [
    "tests/test_native_binding.py",
    "tests/test_native_runtime.py",
    "tests/test_python_surface.py",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--color=yes",
]
markers = []

[tool.coverage.run]
branch = true
source = ["src/vsh"]
omit = [
    "src/vsh/_version.py",
    "src/vsh/agent/**",
    "src/vsh/artifacts/**",
    "src/vsh/execute/**",
    "src/vsh/extensions/**",
    "src/vsh/http/**",
    "src/vsh/io/**",
    "src/vsh/perf/**",
    "src/vsh/persistence/**",
    "src/vsh/plans/**",
    "src/vsh/policy/**",
    "src/vsh/registry/**",
    "src/vsh/sandbox/**",
    "src/vsh/schemas/**",
    "src/vsh/session/**",
    "src/vsh/simulate/**",
    "src/vsh/snapshot/**",
    "src/vsh/effects.py",
    "src/vsh/errors.py",
    "src/vsh/limits.py",
    "src/vsh/runtime.py",
    "src/vsh/mcp/receipts.py",
    "src/vsh/mcp/resources.py",
    "src/vsh/mcp/tools.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 100

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUnusedCallResult = false
include = [
    "src/vsh/__init__.py",
    "src/vsh/_native.pyi",
    "src/vsh/_version.py",
    "src/vsh/cli.py",
    "src/vsh/mcp/__init__.py",
    "src/vsh/mcp/native_tools.py",
    "src/vsh/mcp/surface.py",
    "src/vsh/mcp/server.py",
    "src/vsh/mcp/prompts.py",
    "src/vsh/mcp/codemode_server.py",
    "tests/test_native_binding.py",
    "tests/test_native_runtime.py",
    "tests/test_python_surface.py",
    "release/check_versions.py",
    "release/smoke_wheel.py",
    "release/validate_artifacts.py",
]
extraPaths = ["src", "playground", "examples"]
exclude = ["references/**", "target/**"]
